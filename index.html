<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <title>Joohyun's iPhone</title>
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Joohyun" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/photos.png" />

    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <div id="phone">
        <div id="sb">
          <span id="status-time">2:21</span>
          <div class="isl"></div>
          <button type="button" class="flex items-center gap-1.5 status-controls" aria-label="Open Control Centre" onclick="controlOpen()">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
              <rect y="8" width="3" height="4" rx="1" />
              <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
              <rect x="10" y="3" width="3" height="9" rx="1" />
              <rect x="15" width="3" height="12" rx="1" />
            </svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
              <path
                d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1-1.1A10.400 10.400 0 0 0 8.5.8 10.400 10.400 0 0 0 1.200 3.700l1 1.100a8.900 8.900 0 0 1 6.300-2.500zm0 3.500c1.500 0 2.800.5 3.900 1.500l1-1.100a7.200 7.200 0 0 0-9.800 0l1 1.100c1.100-1 2.400-1.500 3.900-1.500zm0 3.400c-.8 0-1.500.3-2.100.8l2.100 2.300 2.100-2.300c-.6-.5-1.300-.8-2.100-.8z"
              />
            </svg>
            <svg width="27" height="13" viewBox="0 0 27 13">
              <rect
                x=".5"
                y=".5"
                width="22"
                height="12"
                rx="3.500"
                fill="none"
                stroke="currentColor"
                opacity=".4"
              />
              <rect
                x="2"
                y="2"
                width="19"
                height="9"
                rx="2.200"
                fill="currentColor"
              />
              <path
                d="M24 4.500v4c.8-.3 1.500-1.100 1.500-2s-.7-1.700-1.500-2z"
                fill="currentColor"
                opacity=".5"
              />
            </svg>
          </button>
        </div>

        <section id="home" class="scr"></section>

        <section id="lock" class="scr">
          <div id="lock-date" class="lk" data-layout-style="phone-layout-1">
            Friday, 29 Mar
          </div>
          <div
            id="lock-time" class="lk"
            data-layout-style="phone-layout-2"
          >
            2:21<sup
              data-layout-style="phone-layout-3"
              >AM</sup
            >
          </div>
          <div class="lk wgs" data-layout-style="phone-layout-4">
            <div class="wg gl">
              <small data-layout-style="phone-layout-5">Reminders</small
              ><b>Dinner with Seungwan</b
              ><span data-layout-style="phone-layout-6">Today, 7:00 PM</span>
            </div>
            <div class="wg gl">
              <small>Lindenwell</small
              ><b data-layout-style="phone-layout-7">24°</b
              ><span data-layout-style="phone-layout-6">Rain · H:27° L:22°</span>
            </div>
          </div>
          <button class="rb gl" data-layout-style="phone-layout-8" data-phone-action-1="">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M8 2h8v4l-2 3v13a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9L8 6V2zm3 8v3h2v-3h-2z"
              />
            </svg>
          </button>
          <button
            class="rb gl"
            data-layout-style="phone-layout-9"
            data-phone-action-2=""
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M9 4 7.500 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.500L15 4H9zm3 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
              />
            </svg>
          </button>
          <button id="su" data-phone-action-3="">Swipe up to unlock</button>
          <div id="pc">
            <div data-layout-style="phone-layout-10">Enter Passcode</div>
            <div id="dots"></div>
            <div class="kp">
              <button data-phone-action-4="">1</button
              ><button data-phone-action-5="">2</button
              ><button data-phone-action-6="">3</button
              ><button data-phone-action-7="">4</button
              ><button data-phone-action-8="">5</button
              ><button data-phone-action-9="">6</button
              ><button data-phone-action-10="">7</button
              ><button data-phone-action-11="">8</button
              ><button data-phone-action-12="">9</button
              ><button class="z" data-phone-action-13="">0</button>
            </div>
            <button id="del" data-phone-action-14="">Cancel</button>
          </div>
        </section>

        <section id="app" class="scr"></section>
        <div id="hi"></div>
        <div id="glow"></div>
        <div id="ts"></div>
      </div>
    </div>

    <script src="./social-content.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
